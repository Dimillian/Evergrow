<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Evergrow · Character rig</title>
    <link rel="icon" href="data:," />
    <style>
      *{box-sizing:border-box}body{margin:0;padding:24px;color:#dfd4b7;background:#0a1117}main{max-width:1460px;margin:auto}
      h1{font-size:28px;font-weight:500;margin:0 0 7px}p{color:#98aaa8;margin:0 0 22px;font-size:16px}
      #poses.focus{grid-template-columns:minmax(0,560px);justify-content:center}#poses{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px}section{border:1px solid #344440;background:#111c23}
      h2{font-size:19px;font-weight:500;margin:0;padding:9px 13px;border-bottom:1px solid #344440;color:#d2b780}
      canvas{display:block;width:100%;height:auto;aspect-ratio:320/600}@media(min-width:1000px){#poses{grid-template-columns:repeat(4,1fr)}}@media(max-width:360px){body{padding:12px}#poses{grid-template-columns:1fr}}
    </style>
  </head>
  <body><main><h1>Character rig</h1><p>Shared character renderer · eight directions · scrubbable movement and actions</p><p><label>Equipment <select id="equipment"><option value="sword">Sword</option><option value="unarmed">Unarmed</option><option value="shield">Sword + shield</option><option value="twohand">Two-handed sword</option><option value="bow">Bow</option><option value="staff">Fire staff</option><option value="frost">Frost staff</option><option value="wand">Wand + grimoire</option></select></label> <label>Clothing <select id="clothing"><option value="plain">Simple clothing</option><option value="plate">Plate + cloak</option></select></label> <label><input id="helmet" type="checkbox"> Helmet</label> <label>Phase <input id="stride" type="range" min="0" max="1" step="0.01" value="0.25"></label></p><p><label>Focus <select id="focus"><option value="all">All eight directions</option><option>E</option><option>SE</option><option>S</option><option>SW</option><option>W</option><option>NW</option><option>N</option><option>NE</option></select></label> <label><input id="joints" type="checkbox"> Joint overlay</label> <label>Pose <select id="action"><option value="walk">Walking</option><option value="attack">Basic attack</option><option value="cast">Casting</option><option value="thrust">Thrust</option><option value="slam">Slam</option><option value="bash">Shield bash</option></select></label> <label>Travel <select id="travel"><option value="0">Forward</option><option value="1.5707963267948966">Strafe left</option><option value="-1.5707963267948966">Strafe right</option><option value="3.141592653589793">Backward</option></select></label></p><div id="poses" aria-busy="true"></div></main><script type="module" src="/src/rig-review.ts"></script><script type="module" src="/src/tools/review-nav.ts"></script></body>
</html>
